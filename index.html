<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Git simulátor</title>
<meta name="description" content="Simulátor Gitu a GitHubu pro kurz Git a GitHub – rychlý úvod: terminál, soubory, přípravná oblast, graf commitů a GitHub v prohlížeči.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2324292F'/%3E%3Cpath d='M6 12h20' stroke='%23fff' stroke-width='2.4'/%3E%3Cpath d='M13 12c0 7 3 9 6 9s5-3 5-9' fill='none' stroke='%23F05033' stroke-width='2.4'/%3E%3Ccircle cx='6' cy='12' r='2.6' fill='%23fff'/%3E%3Ccircle cx='13' cy='12' r='2.6' fill='%23fff'/%3E%3Ccircle cx='26' cy='12' r='2.6' fill='%23fff'/%3E%3Ccircle cx='19' cy='21' r='2.6' fill='%23F05033'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <svg class="logo" viewBox="0 0 92 40" aria-hidden="true">
    <path d="M4 12 H88" stroke="#fff" stroke-width="2.4"/>
    <path d="M32 12 C 32 30, 40 31, 50 31 S 68 30, 68 12" fill="none" stroke="#F05033" stroke-width="2.4"/>
    <circle cx="4" cy="12" r="4" fill="#fff"/><circle cx="32" cy="12" r="4" fill="#fff"/>
    <circle cx="60" cy="12" r="4" fill="#fff"/><circle cx="88" cy="12" r="4" fill="#fff"/>
    <circle cx="44" cy="31" r="4" fill="#F05033"/><circle cx="58" cy="30" r="4" fill="#F05033"/>
  </svg>
  <div class="titles">
    <span class="kicker">Git a GitHub – rychlý úvod</span>
    <h1>Git simulátor</h1>
  </div>
  <button class="scen-btn" id="scenBtn" type="button" aria-haspopup="dialog">
    <span><small id="scenKicker">Scénář</small><b id="scenTitle">…</b></span>
    <svg class="chev" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  </button>
  <div class="spacer"></div>
  <button class="tbtn" id="cheatBtn" type="button">Tahák</button>
  <button class="tbtn" id="resetBtn" type="button">Začít znovu</button>
</header>

<main class="layout">
  <aside class="card tasks" id="tasks" aria-label="Úkoly"></aside>

  <section class="col" id="workCol">
    <div class="machines" id="machines" role="tablist" aria-label="Počítač"></div>
    <div id="workspace" class="col"></div>
  </section>

  <section class="col viz" id="vizCol"></section>
</main>

<footer class="footer">
  Simulátor odpovídá Gitu 2.47 (Git for Windows). Hlášky Gitu jsou skutečné, poznámky simulátoru jsou česky a šedě.
  Po obnovení stránky začíná scénář znovu. · <a href="https://github.com/mkgymji/git-simulator">zdrojový kód</a>
</footer>

<script src="js/text.js"></script>
<script src="js/world.js"></script>
<script src="js/graph.js"></script>
<script src="js/rename.js"></script>
<script src="js/git.js"></script>
<script src="js/shell.js"></script>
<script src="js/markdown.js"></script>
<script src="js/scenarios.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
